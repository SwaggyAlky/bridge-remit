# Free coursework deployment. Confirm plans in Render before creating resources.
services:
  - type: web
    name: bridge-remit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: RPC_URL
        sync: false
      - key: DEPLOYMENT_FILE
        value: deployment.sepolia.json
      - key: DATABASE_URL
        fromDatabase:
          name: bridge-remit-db
          property: connectionString
databases:
  - name: bridge-remit-db
    plan: free
    databaseName: bridgeremit
    user: bridgeremit
    ipAllowList: []
